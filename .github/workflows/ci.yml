#
# Every pull request must build. A merge to main does not build again: the PR already built the
# merged result (pull_request checks out the merge commit), and Release builds main itself. Run it
# by hand (Actions -> CI -> Run workflow, on any branch) to also get a signed test appx as a 14-day
# artifact.

name: CI

on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      package:
        description: Also make a signed test appx
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: release scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/xbox/tests/release.py

  # Turns the jadyx.exe+RVA frames of a crash report (tools/xbox/crash_addresses.txt) into
  # functions and lines with the PDB of the run the tester installed, printed to the job log.
  symbolize:
    name: symbolize crash
    runs-on: windows-2025
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/xbox
      - id: input
        shell: pwsh
        run: |
          $lines = Get-Content tools/xbox/crash_addresses.txt | Where-Object { $_ -and -not $_.StartsWith('#') }
          "run=$($lines[0].Trim())" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: jadyx-build
          run-id: ${{ steps.input.outputs.run }}
          github-token: ${{ github.token }}
          path: sym
      - shell: pwsh
        run: |
          $lines = Get-Content tools/xbox/crash_addresses.txt | Where-Object { $_ -and -not $_.StartsWith('#') }
          if (-not (Test-Path sym/jadyx.pdb)) { Write-Host "no jadyx.pdb from run $($lines[0])"; exit 0 }
          $llvm = "C:/Program Files/LLVM/bin"
          $base = 0x140000000
          $header = & "$llvm/llvm-readobj.exe" --file-headers sym/jadyx.exe | Select-String 'ImageBase:\s*0x([0-9A-Fa-f]+)'
          if ($header) { $base = [Convert]::ToUInt64($header.Matches[0].Groups[1].Value, 16) }
          foreach ($rva in $lines | Select-Object -Skip 1) {
            $va = $base + [Convert]::ToUInt64($rva.Trim().Replace('0x', ''), 16)
            Write-Host ("=== jadyx.exe+{0}" -f $rva.Trim())
            & "$llvm/llvm-symbolizer.exe" --obj=sym/jadyx.exe --inlines --demangle ("0x{0:x}" -f $va)
            & "$llvm/llvm-symbolizer.exe" --obj=sym/jadyx.pdb --inlines --demangle ("0x{0:x}" -f $va)
          }
          exit 0

  build:
    uses: ./.github/workflows/build.yml
    with:
      # Pull requests are packaged too, so every PR has an appx to sideload (signed with a
      # self-signed certificate when the repo has no signing secrets).
      package: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.package) }}
    secrets: inherit
